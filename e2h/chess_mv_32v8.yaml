chess_multiturn: true
# Easy rows score rule-based; e2h_miles_ttrl rescores majority_vote rows against
# the 32-sample vote, so Miles' own MAJORITY_* types stay unused here.
chess_reward_model_type: RULE_BASED
chess_difficulty_threshold: 1500.0
chess_max_env_calls: 6
chess_call_env_token: "<call_env>"
# Legacy VERL geometry: vote over 32 per prompt, GRPO trains on
# n_samples_per_prompt (8).
chess_ttrl_votes: 32
