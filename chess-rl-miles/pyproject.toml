[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-rl-miles"
version = "0.1.0"
description = "Chess-RL rollout and reward adapters for Miles."
requires-python = ">=3.11"
dependencies = [
  "chess>=1.11.0",
  "huggingface_hub>=0.30.0",
  "pyarrow>=15.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "torch>=2.6",
  "transformers>=4.51",
  "ray>=2.40",
  "safetensors>=0.5",
  "datasets>=3",
  "omegaconf>=2.3",
  "httpx>=0.28",
  "pillow>=10",
  "psutil>=5",
  "aiohttp>=3",
  "requests>=2",
  "numpy>=1.26",
  "tqdm>=4",
  "pyyaml>=6",
  "wandb>=0.19",
  "tensorboard>=2",
  "einops>=0.8",
  "pybase64>=1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "miles"]

[tool.setuptools.packages.find]
include = ["chess_rl_miles*"]
